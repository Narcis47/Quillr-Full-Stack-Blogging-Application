<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quillr — Where thoughts find their voice</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="welcome">
                <span class="eyebrow">New · Free to start</span>
                <h1>Quillr<span class="quill">🪶</span></h1>
                <p class="tagline">Where thoughts find their voice. Join a community of writers and readers sharing ideas worth spreading.</p>
                <ul class="perks" aria-label="Features">
                    <li>Start your blog in seconds</li>
                    <li>No credit card required</li>
                    <li>Readers waiting for you</li>
                </ul>
            </div>

            <div class="cards-wrapper" role="region" aria-label="Authentication">
                <div class="card" id="loginCard" aria-label="Login form">
                    <div class="card-header">
                        <h2>Welcome back</h2>
                        <div class="divider" aria-hidden="true"></div>
                    </div>
                    <div class="card-body">
                        <form class="login-form">
                            <label class="field-label" for="login-email">Email</label>
                            <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
                            <label class="field-label" for="login-password">Password</label>
                            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="submit" class="btn-primary">Sign in</button>
                            <p class="switch-hint">No account? <button type="button" class="link-btn" id="goRegister">Create one →</button></p>
                            <p class="login-message"></p>
                        </form>
                    </div>
                </div>

                <div class="card inactive" id="registerCard" aria-label="Register form" aria-hidden="true">
                    <div class="card-header">
                        <h2>Join Quillr</h2>
                        <div class="divider" aria-hidden="true"></div>
                    </div>
                    <div class="card-body">
                        <form class="register-form">
                            <label class="field-label" for="reg-username">Username</label>
                            <input id="reg-username" type="text" placeholder="yourhandle" autocomplete="username" required tabindex="-1" disabled>
                            <label class="field-label" for="reg-email">Email</label>
                            <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" required tabindex="-1" disabled>
                            <label class="field-label" for="reg-password">Password</label>
                            <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password" required tabindex="-1" disabled>
                            <button type="submit" class="btn-primary" tabindex="-1" disabled>Create account</button>
                            <p class="switch-hint">Have an account? <button type="button" class="link-btn" id="goLogin" tabindex="-1">Sign in →</button></p>
                            <p class="register-message"></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="config.js"></script>
        <script src="api.js"></script>
        <script src="index.js"></script>
    </body>
</html>
