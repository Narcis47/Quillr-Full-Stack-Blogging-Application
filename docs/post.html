<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillr — Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap">
    <link rel="stylesheet" href="shared.css">
    <style>
        .post-page { max-width:720px; margin:0 auto; padding:3rem 1.5rem 6rem; }

        .post-back { margin-bottom:2rem; }

        .post-header { margin-bottom:2rem; }
        .post-header h1 {
            font-family:'Playfair Display',Georgia,serif;
            font-size:clamp(1.8rem,4vw,2.6rem);
            font-weight:700;
            line-height:1.2;
            margin-bottom:1rem;
        }
        .post-byline {
            display:flex;
            align-items:center;
            gap:0.75rem;
            font-size:0.875rem;
            color:var(--text-muted);
        }
        .post-byline a { color:var(--accent); text-decoration:none; font-weight:500; }

        .post-body {
            font-size:1.05rem;
            line-height:1.85;
            color:#d0d0d8;
            word-break:break-word;
        }
        .post-body h1 { font-family:'Playfair Display',Georgia,serif; font-size:1.8rem; font-weight:700; color:var(--text); margin:1.25rem 0 0.5rem; }
        .post-body h2 { font-family:'Playfair Display',Georgia,serif; font-size:1.35rem; font-weight:700; color:var(--text); margin:1rem 0 0.4rem; }
        .post-body h3 { font-family:'Playfair Display',Georgia,serif; font-size:1.1rem; font-weight:700; color:var(--text); margin:0.75rem 0 0.3rem; }
        .post-body blockquote { border-left:3px solid var(--accent); padding:0.5rem 1rem; color:var(--text-muted); margin:0.75rem 0; font-style:italic; background:var(--accent-dim); border-radius:0 8px 8px 0; }
        .post-body a { color:var(--accent); text-decoration:underline; }
        .post-body ul, .post-body ol { padding-left:1.5rem; margin:0.5rem 0; }
        .post-body li { margin:0.25rem 0; }
        .post-body code { background:var(--input-bg); border:1px solid var(--border); border-radius:4px; padding:0.1em 0.4em; font-family:monospace; font-size:0.875em; color:#a5b4fc; }
        .post-body hr { border:none; border-top:1px solid var(--border); margin:1.5rem 0; }
        .post-body p { margin:0 0 0.5rem; }

        .post-actions {
            display:flex;
            gap:0.75rem;
            margin-top:2.5rem;
            padding-top:1.5rem;
            border-top:1px solid var(--border);
        }

        .post-updated {
            font-size:0.78rem;
            color:var(--text-muted);
            margin-top:2rem;
            font-style:italic;
        }

        /* Delete modal */
        .modal-overlay {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.7);
            z-index:200;
            align-items:center;
            justify-content:center;
        }
        .modal-overlay.open { display:flex; }
        .modal {
            background:var(--surface);
            border:1px solid var(--border-hover);
            border-radius:var(--radius);
            padding:2rem;
            max-width:380px;
            width:90%;
        }
        .modal h3 {
            font-family:'Playfair Display',Georgia,serif;
            font-size:1.2rem;
            margin-bottom:0.5rem;
        }
        .modal p { color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem; }
        .modal-actions { display:flex; gap:0.75rem; justify-content:flex-end; }
    </style>
</head>
<body>
<nav>
    <a href="library.html" class="nav-brand">Quillr 🪶</a>
    <div class="nav-actions">
        <a href="write.html" class="btn btn-primary">✦ Write</a>
        <a href="#" class="btn btn-ghost" id="navProfile">Profile</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>
    </div>
</nav>

<div class="page">
    <div class="post-page" id="postContent">
        <div class="loading-state"><div class="spinner"></div></div>
    </div>
</div>

<!-- Delete confirmation -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h3>Delete post?</h3>
        <p>This action cannot be undone. The post will be permanently removed.</p>
        <div class="modal-actions">
            <button class="btn btn-ghost" id="cancelDelete">Cancel</button>
            <button class="btn btn-danger" id="confirmDelete">Delete</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(() => {
    session.requireAuth();
    document.getElementById('navProfile').href = `profile.html?username=${session.username}`;
    document.getElementById('logoutBtn').addEventListener('click', () => { session.clear(); window.location.href='index.html'; });

    const params = new URLSearchParams(location.search);
    const postId = params.get('id');
    if (!postId) { location.href='library.html'; return; }

    let post = null;

    function showToast(msg, type='') {
        const t = document.getElementById('toast');
        t.textContent=msg; t.className=type; t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),3000);
    }

    function formatDate(str) {
        return new Date(str).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function loadPost() {
        try {
            post = await api.getPost(postId);
            document.title = `Quillr — ${post.title}`;
            const isOwner = String(post.userId) === String(session.userId);
            // Fetch username if not embedded in post
            if (!post.username) {
                try { const u = await api.getUser(post.userId); post.username = u.username; } catch {}
            }

            document.getElementById('postContent').innerHTML = `
                <div class="post-back">
                    <a href="library.html" class="btn btn-ghost btn-sm">← Back</a>
                </div>
                <div class="post-header">
                    <h1>${escHtml(post.title)}</h1>
                    <div class="post-byline">
                        <span>By <a href="profile.html?userId=${post.userId}">@${escHtml(post.username||'unknown')}</a></span>
                        <span>·</span>
                        <span>${formatDate(post.createdAt)}</span>
                    </div>
                </div>
                <div class="divider"></div>
                <div class="post-body">${post.content}</div>
                ${post.updatedAt && post.updatedAt !== post.createdAt
                    ? `<p class="post-updated">Last edited ${formatDate(post.updatedAt)}</p>` : ''}
                ${isOwner ? `
                <div class="post-actions">
                    <a href="write.html?edit=${post.id}" class="btn btn-ghost">✎ Edit</a>
                    <button class="btn btn-danger" id="deleteBtn">🗑 Delete</button>
                </div>` : ''}
            `;

            if (isOwner) {
                document.getElementById('deleteBtn').addEventListener('click', () => {
                    document.getElementById('deleteModal').classList.add('open');
                });
            }
        } catch(e) {
            document.getElementById('postContent').innerHTML =
                `<div class="empty-state"><h3>Post not found</h3><p>${e.message}</p><a href="library.html" class="btn btn-ghost" style="margin-top:1rem">← Back</a></div>`;
        }
    }

    document.getElementById('cancelDelete').addEventListener('click', () => {
        document.getElementById('deleteModal').classList.remove('open');
    });

    document.getElementById('confirmDelete').addEventListener('click', async () => {
        try {
            await api.deletePost(postId);
            showToast('Post deleted', 'success');
            setTimeout(() => location.href='library.html', 1000);
        } catch(e) { showToast(e.message,'error'); }
    });

    loadPost();
})();
</script>
</body>
</html>
